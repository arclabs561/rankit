[package]
name = "rankit"
version = "0.1.6"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
description = "Learning-to-rank losses and evaluation"
homepage = "https://github.com/arclabs561/rankit"
repository = "https://github.com/arclabs561/rankit"
documentation = "https://docs.rs/rankit"
keywords = ["learning-to-rank", "ranking", "ndcg", "lambdarank", "ir-eval"]
categories = ["algorithms", "science", "mathematics"]
exclude = ["examples/soft_dtw_ranking.rs"]

[features]
default = ["eval", "losses"]

# IR evaluation metrics (TREC, NDCG, MAP, MRR, precision, recall, batch eval, statistics)
eval = ["dep:anyhow"]

# LTR loss functions (RankNet, LambdaLoss, ApproxNDCG, ListNet, ListMLE)
losses = []

# Gumbel-Softmax and relaxed top-k methods
gumbel = ["dep:rand", "dep:drawset"]

# Parallel computation with Rayon
parallel = ["dep:rayon"]

# Serde serialization for eval types
serde = ["dep:serde", "dep:serde_json"]

# End-to-end retrieval pipeline: tokenize -> index -> score -> rank
pipeline = ["dep:textprep", "dep:postings", "dep:rankfns"]

[dependencies]
fynch = "0.2"
rankops = "0.1.6"
thiserror = "2.0"

# Optional
anyhow = { version = "1.0", optional = true }
rayon = { version = "1.10", optional = true }
rand = { version = "0.9", optional = true }
drawset = { version = "0.1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
textprep = { version = "0.1.3", optional = true }
postings = { version = "0.1.1", optional = true }
rankfns = { version = "0.1.1", optional = true }

[dev-dependencies]
proptest = "1.5"
approx = "0.5"
tempfile = "3"
pare = "0.2"
structops = { version = "0.2" }
statskit = "0.1.1"
descend = "0.1.1"
# Rosetta cross-language correctness fixtures (tests/rosetta_*.rs).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "retrieval_pipeline"
required-features = ["pipeline", "eval"]

[[example]]
name = "train_with_schedule"

[[example]]
name = "ltr_significance"
required-features = ["eval"]

[workspace]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
needless_range_loop = "allow"
