name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Test without default features
        run: cargo test --no-default-features
      - name: Run example assertions
        run: |
          cargo run --example soft_dtw_ranking
          cargo run --example soft_rank
          cargo run --example ltr_significance --features eval
          cargo run --example train_with_schedule

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Build Python extension
        working-directory: rankit-python
        run: uv run --group dev --with maturin maturin develop
      - name: Test Python bindings
        working-directory: rankit-python
        run: uv run --group dev pytest
      - name: Check Python stubs
        working-directory: rankit-python
        run: uv run --group dev mypy --ignore-missing-imports tests

  consumer:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.89.0"
      - name: Check consumer MSRV and dependency graph
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir=$(mktemp -d)
          trap 'rm -rf "$consumer_dir"' EXIT
          RUSTC=$(rustup which --toolchain 1.89.0 rustc)
          RUSTDOC=$(rustup which --toolchain 1.89.0 rustdoc)
          export RUSTC RUSTDOC
          cargo_bin=$(rustup which --toolchain 1.89.0 cargo)
          mkdir "$consumer_dir/src"
          printf 'pub fn probe() {}\n' > "$consumer_dir/src/lib.rs"
          for defaults in true false; do
            cat > "$consumer_dir/Cargo.toml" <<EOF
          [package]
          name = "rankit-consumer"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          rankit = { path = "$GITHUB_WORKSPACE", default-features = $defaults }
          EOF
            "$cargo_bin" check --manifest-path "$consumer_dir/Cargo.toml"
            "$cargo_bin" tree --manifest-path "$consumer_dir/Cargo.toml" \
              --edges normal,build --prefix none > "$consumer_dir/dependencies.txt"
            if grep -Eq '^innr v' "$consumer_dir/dependencies.txt"; then
              echo "Unexpected innr dependency (default-features=$defaults)" >&2
              exit 1
            fi
          done
